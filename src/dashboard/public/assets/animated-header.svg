<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Animated Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9bb2f6">
        <animate attributeName="stop-color" values="#9bb2f6;#b4c6ff;#8ba4f5;#9bb2f6" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#b8cbff">
        <animate attributeName="stop-color" values="#b8cbff;#a3b9f8;#c7d6ff;#b8cbff" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8ba4f5">
        <animate attributeName="stop-color" values="#8ba4f5;#9bb2f6;#b4c6ff;#8ba4f5" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glassmorphic Card Surface -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152852" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#0d1936" stop-opacity="0.97" />
    </linearGradient>

    <!-- Shape Glow Filter -->
    <filter id="shapeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f1e3d" flood-opacity="0.25" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Syne:wght@700;800&amp;display=swap');
      
      .main-title {
        font-family: 'Syne', 'Plus Jakarta Sans', system-ui, sans-serif;
        font-weight: 800;
        font-size: 32px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }

      .subtitle {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-weight: 600;
        font-size: 13.5px;
        fill: #a5b9e8;
      }

      .author-tag {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-weight: 700;
        font-size: 11.5px;
        fill: #b4c6ff;
        letter-spacing: 0.5px;
      }

      .float-shape-1 {
        transform-origin: 100px 100px;
        animation: float1 14s ease-in-out infinite alternate;
      }

      .float-shape-2 {
        transform-origin: 800px 220px;
        animation: float2 18s ease-in-out infinite alternate;
      }

      @keyframes float1 {
        0% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
        50% { transform: translate(25px, 20px) rotate(12deg) scale(1.05); }
        100% { transform: translate(-15px, 30px) rotate(-8deg) scale(0.96); }
      }

      @keyframes float2 {
        0% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
        50% { transform: translate(-20px, -25px) rotate(-15deg) scale(1.06); }
        100% { transform: translate(15px, -10px) rotate(10deg) scale(0.95); }
      }

      .badge-pill {
        transition: transform 0.2s;
      }
    </style>
  </defs>

  <!-- Animated Blue Surface -->
  <rect width="900" height="320" rx="20" fill="url(#bgGrad)" />

  <!-- Ambient Floating Shapes -->
  <g class="float-shape-1" opacity="0.22" filter="url(#shapeShadow)">
    <path d="M 80,40 C 130,20 180,60 170,110 C 160,160 110,180 60,160 C 10,140 30,60 80,40 Z" fill="#152a55" />
    <circle cx="110" cy="100" r="30" fill="#20356d" opacity="0.5" />
  </g>

  <g class="float-shape-2" opacity="0.22" filter="url(#shapeShadow)">
    <path d="M 820,180 C 870,160 910,210 890,260 C 870,300 810,310 770,280 C 730,240 760,190 820,180 Z" fill="#152a55" />
    <polygon points="820,200 850,250 790,250" fill="#20356d" opacity="0.5" />
  </g>

  <!-- Central Structured Card -->
  <rect x="140" y="35" width="620" height="250" rx="16" fill="url(#cardGrad)" stroke="#b4c6ff" stroke-opacity="0.3" stroke-width="1.5" filter="url(#shapeShadow)" />

  <!-- Header Banner Mini Strip -->
  <rect x="140" y="35" width="620" height="8" rx="4" fill="#b4c6ff" opacity="0.8" />

  <!-- Title & Branding -->
  <g text-anchor="middle">
    <!-- Status Dot & Title -->
    <circle cx="340" cy="85" r="5" fill="#10b981" />
    <circle cx="340" cy="85" r="9" fill="#10b981" opacity="0.3">
      <animate attributeName="r" values="7;12;7" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    
    <text x="450" y="93" class="main-title">System Bot</text>
    <text x="450" y="125" class="subtitle">All-in-one Discord server management, utility &amp; moderation bot</text>
    
    <text x="450" y="150" class="author-tag">CREATED &amp; MAINTAINED BY TUDUSTECH</text>

    <!-- Divider Line -->
    <line x1="220" y1="172" x2="680" y2="172" stroke="#243b78" stroke-width="1" />

    <!-- Badges Row Inside Card -->
    <g transform="translate(185, 195)">
      <!-- JavaScript Badge -->
      <g transform="translate(0, 0)">
        <rect width="115" height="34" rx="17" fill="#ffe082" />
        <rect x="1" y="1" width="113" height="32" rx="16" fill="#fff9c4" opacity="0.2" />
        <circle cx="18" cy="17" r="10" fill="#fbc02d" />
        <text x="18" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#5d4037" text-anchor="middle">JS</text>
        <text x="64" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#5d4037" text-anchor="middle">JavaScript</text>
      </g>

      <!-- Node.js Badge -->
      <g transform="translate(130, 0)">
        <rect width="105" height="34" rx="17" fill="#c8e6c9" />
        <circle cx="18" cy="17" r="10" fill="#81c784" />
        <text x="18" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="9" fill="#1b5e20" text-anchor="middle">JS</text>
        <text x="60" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#1b5e20" text-anchor="middle">Node.js</text>
      </g>

      <!-- Discord Badge -->
      <g transform="translate(250, 0)">
        <rect width="110" height="34" rx="17" fill="#d1d9ff" />
        <circle cx="18" cy="17" r="10" fill="#9fa8da" />
        <text x="18" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#1a237e" text-anchor="middle">💬</text>
        <text x="62" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#1a237e" text-anchor="middle">Discord</text>
      </g>

      <!-- Gemini AI Badge -->
      <g transform="translate(375, 0)">
        <rect width="155" height="34" rx="17" fill="#e1bee7" />
        <circle cx="18" cy="17" r="10" fill="#ba68c8" />
        <text x="18" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#4a148c" text-anchor="middle">✨</text>
        <text x="85" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#4a148c" text-anchor="middle">Google Gemini</text>
      </g>
    </g>

    <!-- Bottom Status Text -->
    <text x="450" y="262" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#728ec7">Interactive Panel • Dynamic Voice • Auto-Updater • Live Dashboard</text>
  </g>
</svg>
